# Запуск всей системы одной командой — и локально, и на стенде (тех. ТЗ 9.3).
#
#     локально:  cp .env.example .env && docker compose up --build
#     на стенде: docker compose pull && docker compose up -d
#
# Файл один. Разделение на локальный и продовый существовало ровно затем,
# чтобы в одном собирать образы, а в другом брать их из реестра, — но `build`
# и `image` уживаются в одном определении: с `--build` образ собирается
# локально, без него берётся из GHCR по тегу `IMAGE_TAG`. Всё остальное
# различие сводилось к значениям переменных, а им место в `.env`, а не во
# втором почти таком же файле, который расходится с первым при каждой правке.
#
# Значения берутся из `.env`, если он есть; иначе действуют умолчания ниже,
# рассчитанные на локальный запуск и совпадающие с `.env.example`. На стенде
# `.env` переопределяет их: ENVIRONMENT, DEBUG, DOMAIN, пароли, TLS.

name: navigator

x-core-image: &core-image
  image: ${IMAGE_CORE:-ghcr.io/danil-prog-coder/max_mini_app/core}:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: apps/core/Dockerfile
  restart: unless-stopped

# Сервисы приложения ждут не только живых Postgres и Redis, но и завершения
# миграций и заливки справочников: подниматься на несовпадающей схеме
# бессмысленно, а пустой справочник вузов делает бесполезными блоки 2, 3 и 7.
x-core-depends-on: &core-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  seed:
    condition: service_completed_successfully

x-core-env: &core-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-navigator}:${POSTGRES_PASSWORD:-navigator}@postgres:5432/${POSTGRES_DB:-navigator}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  AI_GATEWAY_URL: http://ai-gateway:8100
  # Реализации внешних источников (уточнения У3, У8). Значения по умолчанию
  # совпадают с .env.example: настоящие там, где источник доступен без ключа.
  SOURCE_VACANCIES: ${SOURCE_VACANCIES:-hh}
  SOURCE_ADMISSION: ${SOURCE_ADMISSION:-fixture}
  SOURCE_COMPETITION_LISTS: ${SOURCE_COMPETITION_LISTS:-fixture}
  SOURCE_TIMETABLES: ${SOURCE_TIMETABLES:-fixture}
  SOURCE_FOOD: ${SOURCE_FOOD:-fixture}
  # Транспорт уведомлений (уточнение У25): очередь в базе по умолчанию.
  NOTIFICATION_TRANSPORT: ${NOTIFICATION_TRANSPORT:-in_app}
  # Доступ в админку — отдельная роль (уточнение У26, тех. ТЗ 9.4).
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # Подпись initData не проверяется, пользователь опознаётся заголовком
  # X-Max-User-Id (тех. ТЗ 9.3). В production сервис с этим флагом не
  # поднимется — проверка в navigator.config. На стенде ENVIRONMENT=staging
  # именно поэтому: алгоритм проверки подписи ещё не сверен с документацией
  # MAX (тех. ТЗ 9.7), и стенд остаётся демонстрационным.
  MOCK_AUTH: ${MOCK_AUTH:-true}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
  # За nginx фронтенд и API живут на одном домене, поэтому на стенде список
  # пустой: браузер не делает кросс-доменных запросов (решение Р67). Локально
  # адрес dev-сервера Vite отличается от адреса API, и он здесь перечислен.
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

services:
  nginx:
    # Официальный образ без своей сборки: ничего, кроме конфига и пары
    # сертификат/ключ, ему не нужно.
    image: nginx:1-alpine
    restart: unless-stopped
    # Единственный сервис с портами наружу.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Открытая часть (сертификат с цепочкой) и закрытый ключ. Оба — PEM,
      # можно как есть, можно в base64: скрипт ниже разбирает оба вида.
      # В репозиторий не попадают и в секреты GitHub не кладутся — живут
      # только в `.env` на сервере (решение Р76).
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      # Нужен только для самоподписанного сертификата локально: в конфиге
      # стоит `server_name _`, и домен ему безразличен.
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Каталог с ключом — в памяти, а не на диске: копии закрытого ключа
    # незачем оседать в слое контейнера.
    tmpfs:
      - /etc/nginx/certs:mode=700
    # Сертификат и ключ приходят переменными окружения, а nginx умеет читать
    # их только из файлов — это и есть весь перевод. Отдельного скрипта или
    # своего образа ради пятнадцати строк не заводим.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        certs=/etc/nginx/certs

        # Значение либо PEM как есть, либо он же в base64.
        write_pem() {
          case "$$1" in
            -----BEGIN*) printf '%s\n' "$$1" ;;
            *)           printf '%s' "$$1" | base64 -d ;;
          esac
        }

        if [ -n "$$TLS_CERT" ] && [ -n "$$TLS_KEY" ]; then
          write_pem "$$TLS_CERT" > "$$certs/cert.pem"
          write_pem "$$TLS_KEY"  > "$$certs/key.pem"
        elif [ -n "$$TLS_CERT" ] || [ -n "$$TLS_KEY" ]; then
          # Половина пары — почти всегда опечатка в имени переменной. Молча
          # свалиться в самоподписанный сертификат здесь нельзя: снаружи это
          # неотличимо от рабочего стенда, а внутри — сломанный вход.
          echo "nginx: задана только одна половина пары TLS_CERT/TLS_KEY" >&2
          exit 1
        else
          echo "nginx: TLS_CERT и TLS_KEY пусты, беру самоподписанный на $$DOMAIN." >&2
          echo "nginx: это годится только локально. На стенде так быть не должно." >&2
          # openssl в официальном образе не установлен: на время сборки его
          # кладут во временную группу и удаляют (проверено по Dockerfile
          # образа). Поэтому ставим на месте — ветка выполняется только
          # локально, где сеть есть, и на стенде не выполняется никогда.
          command -v openssl > /dev/null || apk add --no-cache openssl > /dev/null 2>&1 || {
            echo "nginx: openssl не установлен и поставить не удалось." >&2
            echo "nginx: задайте TLS_CERT и TLS_KEY в .env — см. .env.example." >&2
            exit 1
          }
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -subj "/CN=$$DOMAIN" \
            -keyout "$$certs/key.pem" -out "$$certs/cert.pem" 2> /dev/null
        fi

        chmod 600 "$$certs/key.pem"
        # Сертификат, ключ и их соответствие друг другу проверяет сам nginx:
        # на негодной паре он не стартует и пишет, что именно не так.
        exec nginx -g 'daemon off;'
    depends_on:
      - miniapp
      - core-api
    healthcheck:
      # Отдельный путь на 80-м порту, до редиректа на https: проба не должна
      # ходить сама к себе по TLS и спотыкаться о самоподписанный сертификат.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks: [navigator]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navigator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navigator}
      POSTGRES_DB: ${POSTGRES_DB:-navigator}
    # Порт открыт только на localhost: база нужна разработчику из psql,
    # но не всей сети.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Создаёт базу <POSTGRES_DB>_test для интеграционных тестов (тех. ТЗ 7).
      # Выполняется только при пустом томе, то есть при первом запуске.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navigator} -d ${POSTGRES_DB:-navigator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [navigator]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly — чтобы поставленные в очередь задачи Celery переживали
    # перезапуск контейнера.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [navigator]

  migrate:
    <<: *core-image
    # Разовый шаг: приводит схему к состоянию моделей и завершается. Отдельным
    # сервисом, а не в entrypoint приложения, чтобы миграции выполнялись один
    # раз, а не в каждом контейнере при масштабировании.
    command: ["aerich", "upgrade"]
    environment: *core-env
    restart: "no"
    # Разовое задание: отработало и вышло, пробовать нечего. Унаследованная
    # от core проба стучалась бы в несуществующий HTTP.
    healthcheck:
      test: ["NONE"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [navigator]

  seed:
    <<: *core-image
    # Заливка справочных данных (вузы, уточнение У4) после миграций. Команда
    # идемпотентна, поэтому выполняется при каждом подъёме окружения: так
    # справочник в базе всегда совпадает с файлом в репозитории, и про
    # заливку не нужно помнить руками.
    command: ["python", "-m", "navigator.seed"]
    environment: *core-env
    restart: "no"
    healthcheck:
      test: ["NONE"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [navigator]

  core-api:
    <<: *core-image
    environment: *core-env
    depends_on: *core-depends-on
    # Порт наружу нужен только разработчику — для /docs и curl. Наружу API
    # выносит nginx, и от этой публикации это не зависит.
    #
    # По умолчанию 8010, а не 8000: восьмитысячный занят на машине разработчика
    # чаще любого другого (им пользуются почти все локальные веб-фреймворки), а
    # занятый порт означает, что контейнер вообще не стартует. Свой порт
    # задаётся переменной CORE_API_PORT.
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8010}:8000"
    networks: [navigator]

  worker:
    <<: *core-image
    # Тот же образ, отдельный процесс: подвисший внешний запрос не должен
    # деградировать ответы пользователям (тех. ТЗ 1.3).
    command:
      ["celery", "-A", "navigator.worker.celery_app:app", "worker", "--loglevel=info"]
    environment: *core-env
    depends_on: *core-depends-on
    healthcheck:
      # Проба из образа core стучится в HTTP на 8000, которого у celery нет,
      # поэтому воркер вечно висел бы unhealthy. Не косметика: пока в `ps`
      # половина сервисов красная всегда, по ней нельзя заметить настоящую
      # поломку. Здесь спрашиваем сам celery.
      #
      # CMD-SHELL, а не CMD: имя воркера складывается из $HOSTNAME контейнера,
      # а в exec-форме подстановки переменных не происходит.
      test:
        [
          "CMD-SHELL",
          "celery -A navigator.worker.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks: [navigator]

  beat:
    <<: *core-image
    # Планировщик — отдельным контейнером и ровно в одном экземпляре: два beat
    # поставят каждую задачу дважды.
    command:
      [
        "celery",
        "-A",
        "navigator.worker.celery_app:app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *core-env
    # Планировщик ничего не слушает и никому не отвечает — спрашивать его
    # нечем. Унаследованная от core проба врала бы, поэтому снята: пусть
    # состояние будет «без пробы», а не «сломан».
    healthcheck:
      test: ["NONE"]
    depends_on: *core-depends-on
    networks: [navigator]

  admin:
    <<: *core-image
    # Отдельное приложение и отдельный процесс (уточнение У26, тех. ТЗ 9.4).
    # Порт только на localhost: в очереди лежат тексты обращений пользователей,
    # и наружу её публиковать незачем: доступ к ней — через ssh-туннель на
    # 127.0.0.1:8001, отдельного сайта в nginx для неё нет.
    command:
      [
        "uvicorn",
        "navigator.admin:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    environment: *core-env
    # Тот же образ, но порт другой — 8001 вместо 8000. Унаследованная проба
    # ходила не туда.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on: *core-depends-on
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8001}:8001"
    networks: [navigator]

  ai-gateway:
    image: ${IMAGE_AI:-ghcr.io/danil-prog-coder/max_mini_app/ai-gateway}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/ai-gateway/Dockerfile
    restart: unless-stopped
    # Портов наружу нет: сервис внутренний (тех. ТЗ 5). Изнутри доступен как
    # http://ai-gateway:8100, проверить — `docker compose exec core-api python -c ...`.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379/3
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-300}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_GPT_FOLDER_ID: ${YANDEX_GPT_FOLDER_ID:-}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks: [navigator]

  miniapp:
    # Статика, собранная и отданная nginx внутри образа. Портов наружу нет:
    # наружу её выносит nginx-точка входа.
    image: ${IMAGE_MINIAPP:-ghcr.io/danil-prog-coder/max_mini_app/miniapp}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
      target: production
    restart: unless-stopped
    networks: [navigator]

  miniapp-dev:
    # Профиль, а не обычный сервис: по умолчанию dev-сервер не поднимается.
    # Причина в том, что Vite внутри контейнера выигрывает только у того, у
    # кого нет node — а платит за это все: пересборка образа на каждое
    # изменение зависимостей и HMR через смонтированный том, который на
    # Windows и macOS заметно медленнее. Бэкенд из docker плюс
    # `pnpm --filter miniapp dev` на хосте — рабочий режим по умолчанию;
    # `docker compose --profile frontend up` возвращает прежнее поведение.
    profiles: [frontend]
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
      target: dev
    environment:
      # Пусто — значит «тот же адрес, что и фронт»: запросы уходят на
      # /api/v1/... и dev-сервер проксирует их в core-api по docker-сети.
      # Так браузеру нужен один порт (5173), а занятый порт Core API на машине
      # разработчика перестаёт ломать приложение.
      # Значение зашито пустым, а не берётся из .env, намеренно: в docker
      # правильный ответ всегда один — прокси. Оставь мы здесь подстановку,
      # старый .env с адресом localhost:8000 продолжал бы ломать приложение у
      # того, кто копировал .env.example до этой правки.
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://core-api:8000
      VITE_MOCK_MAX_USER_ID: ${VITE_MOCK_MAX_USER_ID:-mock-user-1}
    ports:
      - "127.0.0.1:${MINIAPP_PORT:-5173}:5173"
    volumes:
      # Исходники смонтированы для HMR, node_modules остаются из образа:
      # они собраны под линукс и структуру pnpm-workspace.
      - ./apps/miniapp:/repo/apps/miniapp
      - /repo/apps/miniapp/node_modules
    networks: [navigator]

volumes:
  postgres-data:
  redis-data:

networks:
  navigator:
    driver: bridge
