worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Резюме (RESUME_MAX_SIZE_BYTES, по умолчанию 10 МБ) и голосовой ввод
    # вакансии (MAX_AUDIO_SIZE_BYTES в app/ai/router.py, 15 МБ) — самые
    # крупные тела запросов P0/P1. Лимит здесь заведомо с запасом: решает,
    # пропускать ли запрос дальше, всегда backend, а не nginx.
    client_max_body_size 20m;

    upstream backend {
        server backend:8000;
    }

    # Схема исходного запроса. На App Platform TLS терминирует платформа и
    # присылает её в X-Forwarded-Proto; при прямом доступе заголовка нет —
    # берём схему самого соединения.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # HTTP: основной вход на App Platform (платформа принимает HTTPS на своём
    # домене и проксирует сюда по HTTP). Раздел 41 тех-доки требует HTTPS:
    # если запрос пришёл через прокси по голому HTTP — редирект на HTTPS.
    # Прямой локальный доступ без прокси обслуживается как есть.
    server {
        listen 80;
        server_name _;

        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        include /etc/nginx/app-locations.conf;
    }

    # HTTPS со своим сертификатом — для локальной разработки
    # (docker-compose.dev.yml) и серверов без внешнего TLS-прокси.
    # Настоящий сертификат подключается в nginx/certs (см. nginx/README.md);
    # если его нет, контейнер сам генерирует самоподписанный при старте.
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        include /etc/nginx/app-locations.conf;
    }
}
