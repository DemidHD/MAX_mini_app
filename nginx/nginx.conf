worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Резюме (RESUME_MAX_SIZE_BYTES, по умолчанию 10 МБ) и голосовой ввод
    # вакансии (MAX_AUDIO_SIZE_BYTES в app/ai/router.py, 15 МБ) — самые
    # крупные тела запросов P0/P1. Лимит здесь заведомо с запасом: решает,
    # пропускать ли запрос дальше, всегда backend, а не nginx.
    client_max_body_size 20m;

    upstream backend {
        server backend:8000;
    }

    # Раздел 41 тех-доки: webhook MAX должен работать только через HTTPS.
    # Проще всего гарантировать это для всего приложения сразу — обычный
    # редирект, TLS терминируется ниже.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # Настоящий сертификат подключается через volume в docker-compose.yml
        # (см. nginx/README.md). Если он не подключён, контейнер сам
        # генерирует самоподписанный при старте (docker-entrypoint.d) —
        # HTTPS поднимается и без внешнего сертификата.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Без пути после имени upstream — nginx передаёт исходный URI как
        # есть; backend сам ждёт префикс /api (app/main.py, api_router).
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhook/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Собранный frontend (раздел 72 тех-доки относит frontend к
        # обязательному минимуму docker-compose). Собирается внутри образа
        # (multi-stage nginx/Dockerfile) — см. README.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
