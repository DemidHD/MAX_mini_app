# Маршруты приложения — общие для HTTP (80) и HTTPS (443) серверов nginx.conf.

# Без пути после имени upstream — nginx передаёт исходный URI как есть;
# backend сам ждёт префикс /api (app/main.py, api_router).
location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

location /webhook/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

location /health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
}

# Собранный frontend (раздел 72 тех-доки относит frontend к обязательному
# минимуму docker-compose). Собирается внутри образа (multi-stage
# nginx/Dockerfile) — см. README.
location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
}
