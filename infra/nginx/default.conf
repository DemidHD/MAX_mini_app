# Точка входа стенда: единственный сервис, который смотрит наружу.
#
# Одно правило, из которого следует всё остальное: фронтенд и API живут на
# **одном** домене. Поэтому браузер не делает кросс-доменных запросов, CORS не
# участвует, а мини-приложению внутри WebView мессенджера MAX не нужно знать
# отдельный адрес бэкенда (решение Р67).
#
# Сертификат и ключ пишутся в /etc/nginx/certs при старте контейнера из
# переменных окружения TLS_CERT и TLS_KEY (решение Р76) — здесь они уже файлы.
#
# server_name _ намеренно: сайт на стенде один, и отдавать его нужно по любому
# имени, под которым пришли. Домен из-за этого не приходится подставлять в
# конфиг, а значит, не нужен ни шаблонизатор, ни своя сборка образа.

server {
    listen 80;
    server_name _;

    # Проба живости контейнера. Отвечает до редиректа: healthcheck не должен
    # ходить по https сам к себе и спотыкаться о проверку сертификата.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Всё остальное — на https. Мини-приложение MAX работает во WebView и по
    # http не запустится, поэтому смысла отдавать что-либо по 80 нет.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # Порядок шифров выбирает клиент: у TLSv1.3 набор и так фиксирован, а для
    # 1.2 современные клиенты подбирают лучше, чем зашитый здесь список.
    ssl_prefer_server_ciphers off;

    # Убирает версию из заголовка Server и со страниц ошибок. Само имя
    # «nginx» остаётся: вырезать заголовок целиком умеет только сторонний
    # модуль headers-more, а официальный образ собран без него. Caddy это
    # умел директивой `-Server` — маленькая потеря, записана честно.
    server_tokens off;

    # Загрузок пока нет (верификация студента — заглушка, уточнение У7), но
    # умолчание в 1 МБ слишком тесное для будущего аплоада студенческого.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Заголовки безопасности. CSP намеренно не задаётся: требования платформы
    # MAX к WebView лежат в закрытой документации (тех. ТЗ 9.7) и ещё не
    # сверены — выставить её наугад значит сломать приложение в мессенджере.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Задано на уровне server и наследуется во все location ниже.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API — по префиксу.
    location /api/ {
        proxy_pass http://core-api:8000;
    }

    # Проба живости наружу: деплой убеждается, что стенд поднялся, не заходя
    # на сервер.
    location = /health {
        proxy_pass http://core-api:8000;
    }

    # Всё остальное — статика мини-приложения. SPA-фолбэк настроен внутри её
    # nginx (apps/miniapp/nginx.conf), поэтому здесь просто проксирование.
    location / {
        proxy_pass http://miniapp:80;
    }
}
