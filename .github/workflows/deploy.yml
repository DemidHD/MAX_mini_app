# Публикация образов после зелёного CI.
#
# Запускается не по пушу, а по **завершению** workflow «CI»: так публикация
# физически не может обогнать проверки. Выкладывается только main и только тот
# коммит, который прошёл проверки.
#
# На сервер отсюда никто не ходит. Входящий SSH с раннеров GitHub до стенда не
# доходит (решение Р71), поэтому связь развёрнута: сервер сам раз в минуту
# проверяет реестр и обновляется. Здесь дело заканчивается публикацией образов
# в GHCR — дальше работает таймер systemd, см. infra/deploy/README.md.
#
# Отсюда же метка org.opencontainers.image.revision на образах: тег latest
# переезжает, а сервер должен знать не «последний», а какой именно коммит он
# выкладывает. Метка — единственное, что связывает образ с коммитом после того,
# как тег переехал.

name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

concurrency:
  # Две одновременные публикации переставляли бы тег latest наперегонки,
  # и сервер мог бы забрать не тот коммит.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Собрать и опубликовать образы
    # Условий осталось два, и проверяются они здесь, а не в отдельном
    # задании: прогон успешен и это main. Третье — «сервер настроен» —
    # отпало вместе с выкладкой по SSH: чтобы опубликовать образ в GHCR,
    # сервер не нужен вовсе.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.images.outputs.prefix }}
    steps:
      - id: images
        # GHCR не принимает заглавные буквы в имени образа, а `github.repository`
        # здесь — `Danil-prog-coder/MAX_mini_app`. Приводим к нижнему регистру.
        run: |
          prefix="$REGISTRY/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          # Тот самый коммит, который прошёл CI, а не «последний в main»:
          # иначе на сервер уехало бы непроверенное изменение, успевшее
          # влиться между прогоном и выкладкой.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Core API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.prefix }}/core:${{ github.event.workflow_run.head_sha }}
            ${{ steps.images.outputs.prefix }}/core:latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max

      - name: AI Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai-gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.prefix }}/ai-gateway:${{ github.event.workflow_run.head_sha }}
            ${{ steps.images.outputs.prefix }}/ai-gateway:latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

      - name: Мини-приложение
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/miniapp/Dockerfile
          target: production
          push: true
          # Пусто — «тот же адрес, что и фронт»: за Caddy API и статика живут
          # на одном домене (решение Р67). У Vite нет рантайм-конфига, поэтому
          # значение попадает в бандл здесь, на сборке.
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ steps.images.outputs.prefix }}/miniapp:${{ github.event.workflow_run.head_sha }}
            ${{ steps.images.outputs.prefix }}/miniapp:latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=miniapp
          cache-to: type=gha,scope=miniapp,mode=max

  verify:
    name: Убедиться, что стенд подхватил сборку
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Дождаться стенда
        env:
          DOMAIN: ${{ secrets.MAX_MINI_APP_DEPLOY_DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::warning::MAX_MINI_APP_DEPLOY_DOMAIN не задан — проверить стенд снаружи нечем"
            exit 0
          fi

          # Таймер на сервере просыпается раз в минуту, плюс подъём контейнеров
          # и выпуск сертификата на первом деплое. Отсюда столько попыток.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://$DOMAIN/health" > /dev/null 2>&1; then
              echo "стенд отвечает: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done

          # Предупреждение, а не ошибка, и это не смягчение приговора.
          # Отсюда нельзя отличить «стенд не поднялся» от «раннер не достучался
          # до стенда»: входящий SSH с GitHub на этот сервер уже не доходит
          # (решение Р71), и HTTPS может не доходить ровно так же. Утверждать
          # по такой проверке, что выкладка провалилась, значит врать в половине
          # случаев. Настоящая проверка живости — на сервере, в журнале
          # navigator-update, и она авторитетна.
          {
            echo "### Стенд не ответил"
            echo
            echo "За десять минут \`https://$DOMAIN/health\` так и не отозвался."
            echo "Это может значить и что выкладка не прошла, и что до стенда"
            echo "не достучался сам раннер. Отличить можно только на сервере:"
            echo
            echo '    journalctl -u navigator-update -n 50'
            echo '    cat /opt/navigator/.deployed'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Стенд не ответил за десять минут — проверьте journalctl -u navigator-update на сервере"
