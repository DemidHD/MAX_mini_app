# Продовый (точнее — стендовый) запуск на сервере.
#
#     docker compose -f docker-compose.prod.yml pull
#     docker compose -f docker-compose.prod.yml up -d
#
# Отличия от локального `docker-compose.yml`, и каждое по делу:
#
# - образы берутся из реестра по тегу, а не собираются на сервере: собирает CI,
#   сервер только выкладывает уже проверенное;
# - фронтенд — статика в nginx (продовая стадия образа), а не dev-сервер Vite;
# - наружу смотрит только Caddy: он держит TLS и раздаёт всё на одном домене,
#   поэтому CORS в этой схеме не участвует (решение Р67);
# - Postgres и Redis портов не публикуют вовсе — к ним ходят только по
#   внутренней сети.
#
# Про режим авторизации. Здесь `ENVIRONMENT=staging`, а не `production`, и это
# осознанно: алгоритм проверки подписи `initData` ещё не сверен с документацией
# MAX (тех. ТЗ 9.7), поэтому вход работает через `MOCK_AUTH`. В `production`
# конфигурация с этим флагом не поднимется — так и задумано. Пока флаг включён,
# стенд остаётся демонстрационным: любой запрос может назвать себя любым
# пользователем.

name: navigator

x-core-image: &core-image
  image: ${IMAGE_CORE:-ghcr.io/danil-prog-coder/max_mini_app/core}:${IMAGE_TAG:-latest}
  restart: unless-stopped

x-core-depends-on: &core-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  seed:
    condition: service_completed_successfully

x-core-env: &core-env
  ENVIRONMENT: ${ENVIRONMENT:-staging}
  DEBUG: 'false'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?нужен POSTGRES_USER}:${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?нужна POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  AI_GATEWAY_URL: http://ai-gateway:8100
  SOURCE_VACANCIES: ${SOURCE_VACANCIES:-hh}
  SOURCE_ADMISSION: ${SOURCE_ADMISSION:-fixture}
  SOURCE_COMPETITION_LISTS: ${SOURCE_COMPETITION_LISTS:-fixture}
  SOURCE_TIMETABLES: ${SOURCE_TIMETABLES:-fixture}
  SOURCE_FOOD: ${SOURCE_FOOD:-fixture}
  NOTIFICATION_TRANSPORT: ${NOTIFICATION_TRANSPORT:-in_app}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?админка без пароля не поднимается}
  MOCK_AUTH: ${MOCK_AUTH:-true}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
  # Фронтенд и API живут на одном домене за Caddy, поэтому список источников
  # пустой: браузер не делает кросс-доменных запросов.
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Единственный сервис с портами наружу. TLS-сертификат Caddy получает и
    # продлевает сам, для этого ему нужны 80 и 443 и настоящий домен.
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?нужен домен, на который выпускать сертификат}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Каталог дополнительных сайтов: пустой по умолчанию, сюда кладётся
      # админка, если её решили выставить наружу (conf.d/admin.caddy.example).
      - ./infra/caddy/conf.d:/etc/caddy/conf.d:ro
      # Сертификаты переживают пересоздание контейнера: без этого тома каждый
      # деплой выпускал бы их заново и упирался в лимиты Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - miniapp
      - core-api
    networks: [navigator]

  miniapp:
    image: ${IMAGE_MINIAPP:-ghcr.io/danil-prog-coder/max_mini_app/miniapp}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Портов наружу нет: статику отдаёт nginx внутри, наружу её выносит Caddy.
    networks: [navigator]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нужен POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?нужна POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [navigator]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [navigator]

  migrate:
    <<: *core-image
    restart: 'no'
    command: ['aerich', 'upgrade']
    environment: *core-env
    # Разовое задание: отработало и вышло, пробовать нечего. Унаследованная
    # от core проба стучалась бы в несуществующий HTTP.
    healthcheck:
      test: ['NONE']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [navigator]

  seed:
    <<: *core-image
    restart: 'no'
    command: ['python', '-m', 'navigator.seed']
    environment: *core-env
    # Разовое задание: отработало и вышло, пробовать нечего. Унаследованная
    # от core проба стучалась бы в несуществующий HTTP.
    healthcheck:
      test: ['NONE']
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [navigator]

  core-api:
    <<: *core-image
    environment: *core-env
    depends_on: *core-depends-on
    networks: [navigator]

  worker:
    <<: *core-image
    command: ['celery', '-A', 'navigator.worker.celery_app:app', 'worker', '--loglevel=info']
    environment: *core-env
    # Проба из образа core стучится в HTTP на 8000, которого у celery нет,
    # поэтому воркер вечно висел бы unhealthy. Не косметика: пока в `ps`
    # половина сервисов красная всегда, по ней нельзя заметить настоящую
    # поломку. Здесь спрашиваем сам celery.
    healthcheck:
      test: ['CMD', 'celery', '-A', 'navigator.worker.celery_app:app', 'inspect', 'ping']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on: *core-depends-on
    networks: [navigator]

  beat:
    <<: *core-image
    command:
      [
        'celery',
        '-A',
        'navigator.worker.celery_app:app',
        'beat',
        '--loglevel=info',
        '--schedule=/tmp/celerybeat-schedule',
      ]
    environment: *core-env
    # Планировщик ничего не слушает и никому не отвечает — спрашивать его
    # нечем. Унаследованная от core проба врала бы, поэтому снята: пусть
    # состояние будет «без пробы», а не «сломан».
    healthcheck:
      test: ['NONE']
    depends_on: *core-depends-on
    networks: [navigator]

  admin:
    <<: *core-image
    command:
      ['uvicorn', 'navigator.admin:create_app', '--factory', '--host', '0.0.0.0', '--port', '8001']
    environment: *core-env
    # Тот же образ, но порт другой — 8001 вместо 8000. Унаследованная проба
    # ходила не туда.
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on: *core-depends-on
    networks: [navigator]

  ai-gateway:
    image: ${IMAGE_AI:-ghcr.io/danil-prog-coder/max_mini_app/ai-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379/3
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-300}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_GPT_FOLDER_ID: ${YANDEX_GPT_FOLDER_ID:-}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks: [navigator]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  navigator:
    driver: bridge
